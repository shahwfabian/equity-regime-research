pipeline:
  name: equity_etl
  version: "0.2.0"

window:
  start_date: null           # null = earliest available per series (full history)
  end_date: null             # null = latest available

store:
  backend: parquet           # "parquet" | "postgres"
  parquet_dir: data/processed/etl_full   # separate dir so 2010-era results are preserved
  postgres_url: "postgresql+psycopg2://localhost:5432/equity_regime"

# Analysis-window definitions: each window specifies required columns.
# The ETL pipeline computes which date range is valid for each analysis
# (rows where ALL required columns are non-NaN) and logs a coverage table.
analysis_windows:
  momentum_core:
    required: [umd, mkt_rf, rf]          # 5-factor + UMD; ~1963-07 to present
    description: "Momentum (UMD) analysis"
  reversal_core:
    required: [st_rev, mkt_rf, rf]       # 5-factor + ST_Rev; ~1963-07 to present
    description: "Short-term reversal analysis"
  five_factor:
    required: [mkt_rf, smb, hml, rmw, cma, rf]   # full 5-factor; 1963-07 to present
    description: "Full 5-factor analysis"
  full_factor:
    required: [mkt_rf, smb, hml, rmw, cma, umd, st_rev, rf]
    description: "5-factor + momentum + reversal"
  vix_regime:
    required: [mkt_rf, rf, vix]          # VIX available from 1990-01-02
    description: "VIX-regime robustness (1990+)"
  umd_raw:
    required: [umd]                      # UMD alone; 1926-11-03 to present
    description: "Raw UMD momentum (1926+, RF=0 assumed pre-1963)"

sources:
  french:
    enabled: true
    cache_dir: data/raw/french
    daily_dataset: "F-F_Research_Data_5_Factors_2x3_daily"
    momentum_dataset: "F-F_Momentum_Factor_daily"
    st_rev_dataset: "F-F_ST_Reversal_Factor_daily"
    lt_rev_dataset: "F-F_LT_Reversal_Factor_daily"
    monthly_dataset: "F-F_Research_Data_5_Factors_2x3"
    base_url: "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp"

  vix:
    enabled: true
    cache_dir: data/raw/vix
    fred_series: "VIXCLS"
    stooq_ticker: "^VIX.US"      # fallback if FRED unavailable
    fred_api_key: ""              # leave blank → use Stooq fallback

  yfinance:
    enabled: false               # set true to pull illustrative stock data
    cache_dir: data/raw/yfinance
    tickers:
      - SPY
      - QQQ
      - IWM
      - GLD
      - TLT
    illustrative_only: true      # NEVER used for headline results

logging:
  level: INFO
  log_file: outputs/logs/etl.log

validation:
  report_path: outputs/reports/data_validation.html
  max_gap_days: 5
  max_abs_return: 0.25
  vix_ffill_limit: 1
