backtest:
  name: equity_backtest
  version: "1.0.0"

# ── Data source ──────────────────────────────────────────────────────────────
data:
  source: parquet                      # "parquet" | "synthetic"
  parquet_dir: data/processed/etl_full # full-history parquet (1926+)
  synthetic_n_days: 1260               # used only when source=synthetic (~5 yr)
  synthetic_seed: 42

# Analysis window to use for the backtest (selects rows where required cols non-NaN)
# "momentum_core" = [umd, mkt_rf, rf] -> 1963-07-01 to present
# "umd_raw"       = [umd] only        -> 1926-11-03 to present (RF=0)
analysis_window: momentum_core

# Subperiod breaks for the headline comparison table
subperiod_breaks:
  - "1963-07-01"   # five-factor era start (also momentum_core start)
  - "1990-01-01"   # VIX era start
  - "2010-01-01"   # post-GFC recovery

# Named crash windows for isolated regime-conditioning analysis
crash_windows:
  Great_Depression: {start: "1929-01-01", end: "1933-01-01"}   # pre-dates 5-factor; informational
  Oil_Bear_1973:    {start: "1973-01-01", end: "1975-01-01"}
  Black_Monday:     {start: "1987-07-01", end: "1988-01-01"}
  DotCom_Bust:      {start: "2000-03-01", end: "2002-12-01"}
  GFC:              {start: "2007-10-01", end: "2009-06-01"}
  Covid:            {start: "2020-02-01", end: "2020-09-01"}

# ── Strategy definitions ──────────────────────────────────────────────────────
# Each strategy maps factor weights → daily portfolio return.
# net return = sum(w_f * r_f_excess) + rf  – cost_drag
strategies:
  long_only_momentum:
    enabled: true
    rebalance: monthly                 # "daily" | "weekly" | "monthly"
    signal_factor: umd                 # go long when prior-period signal > 0

  long_short_momentum:
    enabled: true
    rebalance: monthly                 # always hold UMD (unconditional)

  mean_reversion:
    enabled: true
    rebalance: weekly                  # ST_Rev turns over quickly

  regime_momentum:
    enabled: true
    rebalance: monthly
    calm_exposure: 1.0                 # full long in calm (state=0)
    turbulent_exposure: 0.0            # exit to cash in turbulent (state=1)
    regime_source: vol_rule            # "vol_rule" – inherently causal (expanding vol pct)
    regime_vol_pct: 0.75               # expanding percentile threshold

  market_bah:
    enabled: true
    rebalance: monthly                 # buy-and-hold market (Mkt-RF + RF)

  sixty_forty:
    enabled: true
    rebalance: monthly
    mkt_weight: 0.60                   # 60 % market, 40 % cash (earns RF)

# ── Transaction costs & slippage ─────────────────────────────────────────────
costs:
  tc_bps: 10                           # one-way TC per unit turnover (bps)
  slippage_bps: 5                      # slippage per unit turnover (bps)
  state_dependent_slippage: true       # turbulent → wider slippage
  turbulent_slippage_multiplier: 2.0   # slippage multiplied in turbulent regime

# ── Position sizing ──────────────────────────────────────────────────────────
sizing:
  vol_targeting:
    enabled: false                     # set true to enable vol-targeting
    target_ann_vol: 0.10               # 10 % annualised target vol
    lookback_days: 63                  # trailing days for ex-ante vol estimate
    max_leverage: 2.0                  # cap on gross leverage scalar

# ── Walk-forward validation ───────────────────────────────────────────────────
walkforward:
  mode: expanding                      # "expanding" | "rolling"
  initial_train_days: 1260             # 5-year initial training window
  test_days: 252                       # 1-year OOS test window per fold
  step_days: 252                       # advance 1 year between folds (~57 folds on full history)
  embargo_days: 21                     # trading-day gap between train and test

# ── Cost sweep ───────────────────────────────────────────────────────────────
cost_sweep:
  enabled: true
  bps_grid: [0, 5, 10, 20, 30, 50]    # TC grid for breakeven analysis

# ── Metrics / inference ──────────────────────────────────────────────────────
metrics:
  bootstrap_n: 500                     # 500 resamples; CI is tight with 15k+ obs                    # number of block-bootstrap resamples
  bootstrap_p: 0.10                    # stationary-bootstrap param (mean block = 10d)
  bootstrap_seed: 42                   # reproducibility

# ── Output ───────────────────────────────────────────────────────────────────
report:
  out_path: outputs/reports/backtest_report.html
  tables_dir: outputs/tables

logging:
  level: INFO
  log_file: outputs/logs/backtest.log
